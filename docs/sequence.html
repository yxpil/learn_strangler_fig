<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strangler fig sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="60" y="20" width="120" height="32" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="120" y="41" text-anchor="middle" fill="#92400e">user</text>
    <rect x="280" y="20" width="130" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="345" y="41" text-anchor="middle" fill="#1d4ed8">gateway</text>
    <rect x="520" y="20" width="130" height="32" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="585" y="41" text-anchor="middle" fill="#b91c1c">legacy</text>
    <rect x="730" y="20" width="130" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="795" y="41" text-anchor="middle" fill="#15803d">new</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="120" y1="52" x2="120" y2="390"/>
    <line x1="345" y1="52" x2="345" y2="390"/>
    <line x1="585" y1="52" x2="585" y2="390"/>
    <line x1="795" y1="52" x2="795" y2="390"/>
  </g>

  <line x1="120" y1="90" x2="340" y2="90" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="230" y="84" text-anchor="middle" font-size="11" fill="#1e40af">request</text>
  <line x1="345" y1="115" x2="580" y2="115" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>
  <text x="462" y="109" text-anchor="middle" font-size="11" fill="#b91c1c">mostly legacy (stage 1-2)</text>

  <line x1="345" y1="160" x2="790" y2="160" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="567" y="154" text-anchor="middle" font-size="11" fill="#15803d">slice routed to new (canary)</text>

  <line x1="120" y1="210" x2="340" y2="210" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="345" y1="235" x2="790" y2="235" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="567" y="229" text-anchor="middle" font-size="11" fill="#15803d">100% new (legacy retired)</text>

  <text x="450" y="310" text-anchor="middle" font-size="11.5" fill="#64748b">traffic ratio shifts gradually; roll back anytime.</text>
</svg>
</body>
</html>
